<mat-toolbar color="primary">
  <span class="brand">Fintech</span>
  <span class="spacer"></span>
  @if (isLoggedIn) {
    <a mat-button routerLink="/dashboard" routerLinkActive="active-link">
      <mat-icon>dashboard</mat-icon>
      Dashboard
    </a>
    <a mat-button routerLink="/categories" routerLinkActive="active-link">
      <mat-icon>category</mat-icon>
      Categorias
    </a>
    <a mat-button routerLink="/movements" routerLinkActive="active-link">
      <mat-icon>receipt</mat-icon>
      Movimientos
    </a>
    <a mat-button routerLink="/profile" routerLinkActive="active-link">
      <mat-icon>person</mat-icon>
      Perfil
    </a>
    <button mat-button (click)="logout()">
      <mat-icon>logout</mat-icon>
      Salir
    </button>
  }
</mat-toolbar>

<div class="content">
  <router-outlet />
</div>
