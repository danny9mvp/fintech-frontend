<div class="login-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Iniciar Sesion</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form #form="ngForm" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Correo electronico</mat-label>
          <input
            matInput
            type="email"
            name="email"
            [(ngModel)]="data.email"
            required
            email
          />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Contrasena</mat-label>
          <input
            matInput
            type="password"
            name="password"
            [(ngModel)]="data.password"
            required
          />
        </mat-form-field>
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="form.invalid"
        >
          Ingresar
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <a mat-button routerLink="/register">Crear una cuenta</a>
    </mat-card-actions>
  </mat-card>
</div>
