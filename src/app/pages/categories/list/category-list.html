<div class="page-header">
  <h2>Categorias</h2>
  <button mat-raised-button color="primary" (click)="create()">
    <mat-icon>add</mat-icon>
    Nueva categoria
  </button>
</div>

@if (loading) {
  <mat-progress-bar mode="indeterminate" />
}

@if (!loading && categories.length === 0) {
  <p class="empty">No hay categorias registradas.</p>
}

@if (!loading && categories.length > 0) {
  <div class="table-wrapper">
  <table mat-table [dataSource]="categories">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let c">{{ c.name }}</td>
    </ng-container>
    <ng-container matColumnDef="budget">
      <th mat-header-cell *matHeaderCellDef>Presupuesto</th>
      <td mat-cell *matCellDef="let c">
        {{ c.budget != null ? (c.budget | number:'1.2-2') : '—' }}
      </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let c">
        <button mat-icon-button (click)="edit(c.id)" matTooltip="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="delete(c.id)" matTooltip="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
  </div>
}
