<div class="form-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ isEdit ? 'Editar Movimiento' : 'Nuevo Movimiento' }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form #form="ngForm" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Tipo</mat-label>
          <mat-select name="type" [(ngModel)]="data.type" required>
            <mat-option value="INCOME">Ingreso</mat-option>
            <mat-option value="EXPENSE">Gasto</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Categoria</mat-label>
          <mat-select
            name="movement_category_id"
            [(ngModel)]="data.movement_category_id"
            required
          >
            @for (c of categories; track c.id) {
              <mat-option [value]="c.id">{{ c.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Monto</mat-label>
          <input
            matInput
            type="number"
            name="amount"
            [(ngModel)]="data.amount"
            required
            min="0.01"
            step="0.01"
          />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Descripcion</mat-label>
          <textarea
            matInput
            name="description"
            [(ngModel)]="data.description"
            rows="3"
          ></textarea>
        </mat-form-field>

        <div class="form-actions">
          <button mat-button type="button" (click)="router.navigate(['/movements'])">
            Cancelar
          </button>
          <button
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="loading || form.invalid"
          >
            {{ loading ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
